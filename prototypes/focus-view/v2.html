<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>punch-list · focus view v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: status bar on top, a sorted dot rail on the left, the current question in focus with
   faded neighbours above and below, and the action bar at the bottom. */
:root {
  /* Dark-first developer palette (slate), light variant follows the OS. */
  --bg: #0F172A; --surface: #1B2336; --raised: #222C42; --sunk: #141C2F; --ink: #F8FAFC; --muted: #A3B1C6; --line: #334155;
  --accent: #22C55E; --accent-ink: #052E16; --accent-soft: #12351F;
  --need: #F5A524; --need-soft: #3A2A0E; --wait: #60A5FA; --wait-soft: #172A47; --ok: #34D399; --ok-soft: #0F3326; --skip: #8291A8; --skip-soft: #1E2738;
  --ring: #E2E8F0;
  --font: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #F6F7F9; --surface: #FFFFFF; --raised: #FFFFFF; --sunk: #EEF1F5; --ink: #0F172A; --muted: #475569; --line: #CBD5E1;
    --accent: #15803D; --accent-ink: #FFFFFF; --accent-soft: #DCFCE7;
    --need: #B45309; --need-soft: #FEF3C7; --wait: #1D4ED8; --wait-soft: #DBEAFE; --ok: #047857; --ok-soft: #D1FAE5; --skip: #64748B; --skip-soft: #E2E8F0;
    --ring: #0F172A; color-scheme: light; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { scroll-padding-bottom: 96px; scroll-padding-top: 96px; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 6px; }
.skip-link { position: absolute; left: 12px; top: -40px; background: var(--ink); color: var(--bg); padding: 6px 12px; border-radius: 6px; z-index: 20; }
.skip-link:focus { top: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.g { width: 16px; height: 16px; flex: none; display: block; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
code { font-family: var(--mono); font-size: .9em; background: var(--sunk); padding: 1px 5px; border-radius: 4px; }

.proto-note { background: var(--sunk); color: var(--muted); border-bottom: 1px solid var(--line); font-size: 13px; padding: 6px 16px; text-align: center; }
.proto-note b { color: var(--need); }

.shell { max-width: 1000px; margin: 0 auto; padding: 20px 16px 132px; display: grid; grid-template-columns: 32px 1fr; gap: 0 20px; }
.head { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 2px; margin-bottom: 12px; }
.eyebrow { font-family: var(--mono); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.eyebrow b { color: var(--accent); }
h1 { margin: 0; font-size: 22px; line-height: 1.25; }

/* Status bar */
.status { grid-column: 1 / -1; position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0 12px; display: flex; flex-direction: column; gap: 6px; }
.segments { display: flex; gap: 4px; height: 10px; }
.seg { border: none; padding: 0; border-radius: 4px; cursor: pointer; transition: flex-grow .35s ease; min-width: 0; }
.seg:hover { filter: brightness(1.15); }
.seg.need { background: var(--need); } .seg.wait { background: var(--wait); } .seg.ok { background: var(--ok); } .seg.skip { background: var(--skip); }
.seg-labels { display: flex; gap: 6px 18px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.seg-labels button { background: none; border: none; padding: 4px 2px; min-height: 28px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
.seg-labels button:hover { color: var(--ink); }
.seg-labels b { color: var(--ink); font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.g.need { color: var(--need); } .g.wait { color: var(--wait); } .g.ok { color: var(--ok); } .g.skip { color: var(--skip); }
.dot.need { background: var(--need); } .dot.wait { background: var(--wait); } .dot.ok { background: var(--ok); } .dot.skip { background: var(--skip); }

/* Rail */
.rail-wrap { position: sticky; top: 86px; align-self: start; }
.rail-toggle { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; display: grid; place-items: center; margin-bottom: 6px; }
.rail-toggle:hover { color: var(--ink); }
.rail { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; position: relative; }
.rail .r { width: 28px; height: 28px; border-radius: 8px; border: none; padding: 0; cursor: pointer; position: relative; display: grid; place-items: center; background: transparent; transition: background .15s var(--ease); }
.rail .r:hover { background: var(--raised); }
.rail .r.current { background: var(--raised); box-shadow: inset 0 0 0 2px var(--ink); }
.rail .r.fresh::after { content: ""; position: absolute; inset: 2px; border-radius: 8px; border: 2px solid var(--need); animation: pulse 1.4s ease-out infinite; }
@keyframes pulse { from { opacity: 1; transform: scale(.8); } to { opacity: 0; transform: scale(1.6); } }
.rail .div { width: 18px; height: 1px; background: var(--line); margin: 4px 0; }
.titles { position: absolute; left: 36px; top: -8px; width: 320px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; box-shadow: 0 10px 30px rgb(0 0 0 / .14); display: flex; flex-direction: column; gap: 2px; opacity: 0; pointer-events: none; transform: translateX(-6px); transition: opacity .15s, transform .15s; z-index: 6; }
.rail-wrap:hover .titles, .rail-wrap:focus-within .titles, .rail-wrap.open .titles { opacity: 1; pointer-events: auto; transform: none; }
.titles .grp { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 6px 6px 2px; }
.titles button { display: flex; gap: 8px; align-items: center; text-align: left; background: none; border: none; padding: 6px 8px; min-height: 32px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.titles button:hover, .titles button.current { background: var(--sunk); }
.titles button span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Stage */
.stage { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.peek { display: flex; gap: 10px; align-items: center; padding: 10px 14px; min-height: 44px; border: 1px dashed var(--line); border-radius: 10px; background: transparent; color: var(--muted); cursor: pointer; text-align: left; transition: border-color .15s var(--ease), color .15s var(--ease); }
.peek:hover { color: var(--ink); border-style: solid; border-color: var(--muted); }
.peek .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.peek .where { font-size: 12px; color: var(--muted); white-space: nowrap; }
.peek.empty { visibility: hidden; }
.chip { font-family: var(--mono); font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.need { background: var(--need-soft); color: var(--need); } .chip.wait { background: var(--wait-soft); color: var(--wait); } .chip.ok { background: var(--ok-soft); color: var(--ok); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 12px 32px rgb(0 0 0 / .18); }
.card.need-card { border-top: 3px solid var(--need); } .card.wait-card { border-top: 3px solid var(--wait); } .card.ok-card { border-top: 3px solid var(--ok); } .card.skip-card { border-top: 3px solid var(--skip); }
.card.enter { animation: enter .24s var(--ease); }
@keyframes enter { from { opacity: 0; transform: translateY(var(--from, 14px)); } to { opacity: 1; transform: none; } }
.card-top { display: flex; justify-content: space-between; gap: 12px; align-items: center; font-size: 12px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: .05em; }
.card h2 { margin: 0; font-size: 22px; line-height: 1.3; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.body { color: var(--ink); }
.body p { margin: 0 0 6px; }
.changed { background: var(--need-soft); color: var(--need); border-radius: 8px; padding: 8px 12px; font-size: 14px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }

.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 26px 1fr; gap: 12px; align-items: start; padding: 12px 14px; min-height: 48px; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; text-align: left; }
.opt:hover { border-color: var(--muted); background: var(--raised); }
.opt { transition: border-color .15s var(--ease), background .15s var(--ease); }
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.key { font-family: var(--mono); font-size: 12px; width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); background: var(--sunk); }
.opt.on .key { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt b { font-weight: 600; }
.opt small { display: block; color: var(--muted); font-size: 13.5px; }
.rec { font-family: var(--mono); font-size: 11px; text-transform: uppercase; color: var(--need); background: var(--need-soft); padding: 1px 6px; border-radius: 999px; margin-left: 6px; }
textarea { width: 100%; min-height: 80px; font: inherit; color: var(--ink); background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; resize: vertical; }

.thread { border-left: 3px solid var(--wait); background: var(--wait-soft); border-radius: 0 8px 8px 0; padding: 12px 14px; padding-left: 12px; display: flex; flex-direction: column; gap: 10px; }
.thread .asked { font-size: 13px; color: var(--muted); }
.typing { color: var(--wait); font-size: 14px; }
.typing::after { content: "…"; animation: dots 1.2s steps(4, end) infinite; display: inline-block; width: 1.2em; overflow: hidden; vertical-align: bottom; }
@keyframes dots { from { width: 0; } to { width: 1.2em; } }
.ask { background: var(--sunk); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.ask textarea { background: var(--surface); min-height: 56px; }

.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { font-weight: 600; font-size: 14px; border-radius: 8px; padding: 9px 16px; min-height: 40px; transition: filter .15s var(--ease), border-color .15s var(--ease); border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:not(.ghost):not(.link):hover { filter: brightness(1.08); }
.btn.ghost:hover { border-color: var(--accent); }
.btn.link { background: none; border: none; color: var(--muted); padding: 6px 8px; font-weight: 500; }
.btn.link:hover { color: var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.spacer { flex: 1; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--muted); background: var(--surface); }

.done-card { text-align: center; align-items: center; }
.done-card .big { width: 48px; height: 48px; color: var(--ok); }
.later { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 6px; }

.keys { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; font-size: 12px; color: var(--muted); margin-top: 6px; }

.bar { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line); z-index: 7; }
.bar-in { max-width: 980px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.bar .listen { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.bar .listen .dot { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.toast { position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 9; }

@media (max-width: 640px) {
  .shell { grid-template-columns: 1fr; }
  .rail-wrap { position: static; }
  .rail { flex-direction: row; flex-wrap: wrap; justify-content: center; }
  .rail .div { width: 1px; height: 14px; margin: 0 2px; }
  .titles { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<a class="skip-link" href="#stage">Skip to the current question</a>
<div class="sr" role="status" aria-atomic="true" id="live"></div>
<div class="proto-note">Prototype with sample data. <b>v2 design pass.</b> Claude's replies are simulated (an explanation arrives ~3 s after you ask). Nothing is saved.</div>
<div class="shell">
  <header class="head">
    <div class="eyebrow"><b>punch-list</b> · team-offsite</div>
    <h1>Plan the team offsite</h1>
  </header>
  <div class="status" id="status"></div>
  <div class="rail-wrap" id="railWrap"><button class="rail-toggle" id="railToggle" aria-expanded="false" aria-controls="titles" title="Show all questions (L)"><svg class="g" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span class="sr">Show all questions</span></button><nav class="rail" id="rail" aria-label="All questions"></nav><div class="titles" id="titles"></div></div>
  <main class="stage" id="stage" tabindex="-1"></main>
</div>
<div class="bar"><div class="bar-in">
  <span class="listen"><span class="dot"></span>Claude is listening</span>
  <span class="spacer"></span>
  <span id="unsent" class="chip"></span>
  <button class="btn" id="send">Send to Claude</button>
  <button class="btn ghost" id="done">Done</button>
</div></div>
<div class="toast" id="toast" hidden></div>

<script>
const Q = [
  { id: 'go', title: 'Should we run an offsite this quarter?', type: 'yes-no', body: '<p>Last one was in March. Budget is approved up to <code>€8k</code>.</p>', status: 'answered', answer: 'yes' },
  { id: 'where', title: 'Where should it be?', type: 'single', body: '<p>Prices are for 12 people, 2 nights.</p>', options: [
    { v: 'lisbon', l: 'Lisbon', d: '~€6.1k. Cheapest flights for most of the team.', rec: true },
    { v: 'krakow', l: 'Kraków', d: '~€4.8k. Closest to the dev team; 2 people need visas.' },
    { v: 'remote', l: 'Remote only', d: '~€900 for a shared online event.' } ], status: 'open' },
  { id: 'days', title: 'How many working days?', type: 'single', options: [{ v: '1', l: '1 day' }, { v: '2', l: '2 days', rec: true }, { v: '3', l: '3 days' }], status: 'changed', answer: '3',
    body: '<p>Travel days are not counted.</p>' },
  { id: 'topics', title: 'Which topics must be covered?', type: 'multi', options: [
    { v: 'roadmap', l: '2027 roadmap' }, { v: 'oncall', l: 'On-call rotation' }, { v: 'hiring', l: 'Hiring plan' }, { v: 'fun', l: 'Something fun' } ], status: 'open' },
  { id: 'hotel', title: 'Hotel: city centre or beach?', type: 'single', options: [{ v: 'centre', l: 'City centre', rec: true }, { v: 'beach', l: 'Beach (Cascais)', d: '40 min by train.' }], status: 'answered', answer: 'centre' },
  { id: 'energy', title: 'How tired is the team right now?', type: 'single', options: [1, 2, 3, 4, 5].map((n) => ({ v: String(n), l: String(n), d: n === 1 ? 'fresh' : n === 5 ? 'exhausted' : '' })), status: 'skipped' },
  { id: 'food', title: 'Any dietary needs I should know about?', type: 'text', status: 'open' },
  { id: 'budget', title: 'Can we go over budget by up to 10% for a better venue?', type: 'yes-no', status: 'explaining', asked: 'What venue options are we talking about?' },
  { id: 'merch', title: 'Order team T-shirts?', type: 'yes-no', status: 'answered', answer: 'no' },
];
for (const q of Q) { q.explanations ||= []; q.unsent = q.status === 'answered' ? false : false; }

const GROUP = { open: 0, changed: 0, explaining: 1, answered: 2, skipped: 3 };
const GROUP_NAME = ['Needs you', 'Claude is explaining', 'Answered', 'Skipped'];
const GROUP_CLASS = ['need', 'wait', 'ok', 'skip'];
/** Status is shown by shape as well as colour: ! needs you, … explaining, ✓ answered, – skipped. */
const GLYPH = [
  '<svg class="g need" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M8 4.5v4.2M8 11.2v.3" stroke="var(--bg)" stroke-width="1.8" stroke-linecap="round"/></svg>',
  '<svg class="g wait" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="5" cy="8" r="1.1" fill="currentColor"/><circle cx="8" cy="8" r="1.1" fill="currentColor"/><circle cx="11" cy="8" r="1.1" fill="currentColor"/></svg>',
  '<svg class="g ok" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M4.8 8.3l2.1 2.1 4.3-4.6" fill="none" stroke="var(--bg)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  '<svg class="g skip" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.4 2"/><path d="M5.5 8h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
];
const announce = (t) => { const l = document.getElementById('live'); l.textContent = ''; setTimeout(() => (l.textContent = t), 30); };
let currentId = null;
let order = [];
let lastDir = 1;
const $ = (id) => document.getElementById(id);
const byId = (id) => Q.find((q) => q.id === id);
const group = (q) => GROUP[q.status];

/** Needs-you first, then explaining, answered, skipped; original order inside each group. */
function resort() {
  order = [...Q].sort((a, b) => group(a) - group(b) || Q.indexOf(a) - Q.indexOf(b)).map((q) => q.id);
}
const idx = () => order.indexOf(currentId);
const firstNeeding = (after) => {
  const start = after == null ? 0 : order.indexOf(after) + 1;
  const rest = [...order.slice(start), ...order.slice(0, start)];
  return rest.find((id) => group(byId(id)) === 0) || null;
};

function go(id, dir) {
  lastDir = dir ?? (order.indexOf(id) >= idx() ? 1 : -1);
  currentId = id;
  render();
  const q = byId(id);
  announce(`${q.title}. ${GROUP_NAME[group(q)]}. Question ${idx() + 1} of ${order.length}.`);
}
function nextNeeding() {
  resort();
  const next = firstNeeding(currentId);
  if (next && next !== currentId) go(next, 1);
  else { currentId = null; render(); }
}

function setAnswer(q, value, { advance } = {}) {
  q.answer = value;
  const has = Array.isArray(value) ? value.length > 0 : value !== undefined && value !== '';
  q.status = has ? 'answered' : 'open';
  q.unsent = true;
  if (advance && has) {
    renderCurrentOnly();
    setTimeout(() => nextNeeding(), 380);
  } else {
    renderChrome();
  }
}

function askClaude(q, text) {
  q.status = 'explaining';
  q.asked = text;
  toast('Claude is on it. Moving to the next question meanwhile.');
  setTimeout(() => nextNeeding(), 300);
  setTimeout(() => {
    q.explanations.push({ asked: text, html: simulated(q, text) });
    q.status = q.answer ? 'answered' : 'open';
    q.fresh = true;
    resort();
    render();
    toast(`New explanation on “${q.title}”`);
    announce(`Claude explained “${q.title}”. It is back in Needs you.`);
  }, 3200);
}
function simulated(q, text) {
  return `<p><b>Simpler:</b> this decides ${q.title.toLowerCase().replace(/\?$/, '')}. ${text ? `About “${text}”: ` : ''}here's a concrete example of what each answer leads to.</p>
    <table style="border-collapse:collapse;font-size:14px"><tr><th style="text-align:left;padding:4px 10px 4px 0">If you pick</th><th style="text-align:left">Then</th></tr>
    ${(q.options || [{ l: 'Yes' }, { l: 'No' }]).slice(0, 3).map((o) => `<tr><td style="padding:4px 10px 4px 0">${o.l}</td><td style="color:var(--muted)">I'll plan around it and tell you the cost.</td></tr>`).join('')}</table>`;
}

// ---------- rendering ----------

function renderStatus() {
  const counts = [0, 0, 0, 0];
  for (const q of Q) counts[group(q)]++;
  const s = $('status');
  s.replaceChildren();
  const segs = document.createElement('div');
  segs.className = 'segments';
  counts.forEach((n, g) => {
    if (!n) return;
    const b = document.createElement('button');
    b.className = `seg ${GROUP_CLASS[g]}`;
    b.style.flexGrow = n;
    b.title = `${GROUP_NAME[g]}: ${n}`;
    b.onclick = () => { const id = order.find((x) => group(byId(x)) === g); if (id) go(id); };
    segs.append(b);
  });
  const labels = document.createElement('div');
  labels.className = 'seg-labels';
  counts.forEach((n, g) => {
    const b = document.createElement('button');
    b.innerHTML = `${GLYPH[g]}<b>${n}</b> ${GROUP_NAME[g].toLowerCase()}`;
    b.onclick = () => { const id = order.find((x) => group(byId(x)) === g); if (id) go(id); };
    labels.append(b);
  });
  s.append(segs, labels);
}

function renderRail() {
  const rail = $('rail');
  const titles = $('titles');
  rail.replaceChildren();
  titles.replaceChildren();
  let prevGroup = -1;
  for (const id of order) {
    const q = byId(id);
    const g = group(q);
    if (g !== prevGroup) {
      if (prevGroup !== -1) rail.append(Object.assign(document.createElement('div'), { className: 'div' }));
      titles.append(Object.assign(document.createElement('div'), { className: 'grp', textContent: GROUP_NAME[g] }));
      prevGroup = g;
    }
    const r = document.createElement('button');
    r.className = `r${id === currentId ? ' current' : ''}${q.fresh ? ' fresh' : ''}`;
    r.innerHTML = GLYPH[g];
    r.setAttribute('aria-label', `${q.title} (${GROUP_NAME[g].toLowerCase()})`);
    if (id === currentId) r.setAttribute('aria-current', 'true');
    r.onclick = () => go(id);
    rail.append(r);
    const t = document.createElement('button');
    if (id === currentId) t.className = 'current';
    t.innerHTML = `${GLYPH[g]}<span></span>`;
    t.lastChild.textContent = q.title;
    t.onclick = () => go(id);
    titles.append(t);
  }
}

function answerText(q) {
  if (q.answer == null || q.answer === '' || (Array.isArray(q.answer) && !q.answer.length)) return '';
  if (q.type === 'yes-no') return q.answer === 'yes' ? 'Yes' : 'No';
  if (q.type === 'text') return q.answer.length > 24 ? q.answer.slice(0, 23) + '…' : q.answer;
  const label = (v) => q.options.find((o) => o.v === v)?.l ?? v;
  return Array.isArray(q.answer) ? q.answer.map(label).join(', ') : label(q.answer);
}

function peek(id, where) {
  const b = document.createElement('button');
  if (!id) { b.className = 'peek empty'; return b; }
  const q = byId(id);
  const g = group(q);
  b.className = 'peek';
  const chip = g === 2 ? `<span class="chip ok">${answerText(q)}</span>` : `<span class="chip ${GROUP_CLASS[g]}">${GROUP_NAME[g].toLowerCase()}</span>`;
  b.innerHTML = `${GLYPH[g]}<span class="t"></span>${chip}<span class="where">${where}</span>`;
  b.setAttribute('aria-label', `${where.replace(/[↑↓]\s*/, '')}: ${q.title}, ${GROUP_NAME[g].toLowerCase()}`);
  b.querySelector('.t').textContent = q.title;
  b.onclick = () => go(id, where.includes('↑') ? -1 : 1);
  return b;
}

function optionList(q) {
  const wrap = document.createElement('div');
  wrap.className = 'opts';
  const opts = q.type === 'yes-no' ? [{ v: 'yes', l: 'Yes' }, { v: 'no', l: 'No' }] : q.options;
  const chosen = q.type === 'multi' ? new Set(q.answer || []) : new Set([q.answer]);
  opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = `opt${chosen.has(o.v) ? ' on' : ''}`;
    b.setAttribute('aria-pressed', String(chosen.has(o.v)));
    b.innerHTML = `<span class="key">${i + 1}</span><span><b></b>${o.rec ? '<span class="rec">recommended</span>' : ''}${o.d ? '<small></small>' : ''}</span>`;
    b.querySelector('b').textContent = o.l;
    if (o.d) b.querySelector('small').textContent = o.d;
    b.onclick = () => pick(q, o.v);
    wrap.append(b);
  });
  return wrap;
}

function pick(q, v) {
  if (q.type === 'multi') {
    const set = new Set(q.answer || []);
    set.has(v) ? set.delete(v) : set.add(v);
    setAnswer(q, q.options.map((o) => o.v).filter((x) => set.has(x)));
    renderCurrentOnly();
  } else {
    setAnswer(q, v, { advance: true });
  }
}

function questionCard(q) {
  const card = document.createElement('section');
  card.className = `card enter ${GROUP_CLASS[group(q)]}-card`;
  card.setAttribute('aria-labelledby', 'qtitle');
  card.style.setProperty('--from', `${lastDir * 14}px`);
  const g = group(q);
  const pos = order.filter((id) => group(byId(id)) === g).indexOf(q.id) + 1;
  const total = order.filter((id) => group(byId(id)) === g).length;
  card.innerHTML = `<div class="card-top"><span style="display:flex;gap:8px;align-items:center">${GLYPH[g]}${GROUP_NAME[g]} · ${pos} of ${total}</span><span>${idx() + 1} / ${order.length}</span></div><h2 id="qtitle"></h2>`;
  card.querySelector('h2').textContent = q.title;
  if (q.status === 'changed') {
    const c = document.createElement('div');
    c.className = 'changed';
    c.innerHTML = `<span>Claude changed this question after you answered (you said <b>${answerText(q)}</b>). Check it.</span>`;
    const keep = Object.assign(document.createElement('button'), { className: 'btn ghost', textContent: 'My answer still stands' });
    keep.onclick = () => { q.status = 'answered'; q.unsent = true; nextNeeding(); };
    c.append(keep);
    card.append(c);
  }
  if (q.body) { const b = document.createElement('div'); b.className = 'body'; b.innerHTML = q.body; card.append(b); }
  if (q.type === 'text') {
    const ta = document.createElement('textarea');
    ta.placeholder = 'Type your answer';
    ta.value = q.answer || '';
    ta.oninput = () => setAnswer(q, ta.value);
    card.append(ta);
    setTimeout(() => ta.focus(), 50);
  } else card.append(optionList(q));

  if (q.explanations.length || q.status === 'explaining') {
    const th = document.createElement('div');
    th.className = 'thread';
    for (const e of q.explanations) {
      const it = document.createElement('div');
      it.innerHTML = (e.asked ? `<div class="asked"><b>You asked:</b> </div>` : '') + e.html;
      if (e.asked) it.querySelector('.asked').append(e.asked);
      th.append(it);
    }
    if (q.status === 'explaining') th.append(Object.assign(document.createElement('div'), { className: 'typing', textContent: 'Claude is explaining' + (q.asked ? ` (“${q.asked}”)` : '') }));
    card.append(th);
  }

  const ask = document.createElement('div');
  ask.className = 'ask';
  ask.hidden = true;
  ask.innerHTML = `<textarea placeholder="What's unclear? Ask your own question, or leave empty for a simpler explanation."></textarea>`;
  const askBtns = document.createElement('div');
  askBtns.className = 'actions';
  const send = Object.assign(document.createElement('button'), { className: 'btn', textContent: 'Ask Claude' });
  send.onclick = () => askClaude(q, ask.querySelector('textarea').value.trim());
  const cancel = Object.assign(document.createElement('button'), { className: 'btn ghost', textContent: 'Cancel' });
  cancel.onclick = () => (ask.hidden = true);
  askBtns.append(send, cancel);
  ask.append(askBtns);
  card.append(ask);

  const actions = document.createElement('div');
  actions.className = 'actions';
  const what = Object.assign(document.createElement('button'), { className: 'btn ghost', innerHTML: 'Wait, what? <kbd>?</kbd>' });
  what.dataset.act = 'what';
  what.onclick = () => { ask.hidden = false; ask.querySelector('textarea').focus(); };
  const skip = Object.assign(document.createElement('button'), { className: 'btn link', innerHTML: q.status === 'skipped' ? 'Unskip' : 'Skip for now <kbd>S</kbd>' });
  skip.onclick = () => skipCurrent();
  const next = Object.assign(document.createElement('button'), { className: 'btn', innerHTML: 'Next that needs me <kbd>↵</kbd>' });
  next.onclick = () => nextNeeding();
  actions.append(what, skip, Object.assign(document.createElement('span'), { className: 'spacer' }), next);
  card.append(actions);
  return card;
}

function doneCard() {
  const card = document.createElement('section');
  card.className = 'card done-card enter';
  const skipped = Q.filter((q) => q.status === 'skipped');
  const explaining = Q.filter((q) => q.status === 'explaining');
  card.innerHTML = `<svg class="big" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M4.8 8.3l2.1 2.1 4.3-4.6" fill="none" stroke="var(--bg)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><h2>Nothing needs you right now</h2>
    <p style="margin:0;color:var(--muted)">${explaining.length ? `Claude is still explaining ${explaining.length} question${explaining.length > 1 ? 's' : ''}; it will come back to the top when the answer lands.` : 'Send your answers, or mark the board done.'}</p>`;
  if (skipped.length) {
    const later = document.createElement('div');
    later.className = 'later';
    later.innerHTML = '<div class="eyebrow">You skipped</div>';
    for (const q of skipped) later.append(peek(q.id, 'go back'));
    card.append(later);
  }
  const a = document.createElement('div');
  a.className = 'actions';
  const s = Object.assign(document.createElement('button'), { className: 'btn', textContent: 'Send to Claude' });
  s.onclick = () => $('send').click();
  const d = Object.assign(document.createElement('button'), { className: 'btn ghost', textContent: 'Done' });
  d.onclick = () => $('done').click();
  a.append(s, d);
  card.append(a);
  return card;
}

function renderStage() {
  const stage = $('stage');
  stage.replaceChildren();
  if (!currentId) {
    stage.append(doneCard());
  } else {
    const i = idx();
    stage.append(peek(order[i - 1], '↑ previous'), questionCard(byId(currentId)), peek(order[i + 1], '↓ next'));
  }
  const keys = document.createElement('div');
  keys.className = 'keys';
  keys.innerHTML = '<span><kbd>L</kbd> list</span><span><kbd>1</kbd>–<kbd>9</kbd> pick</span><span><kbd>↵</kbd> next that needs me</span><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>S</kbd> skip</span><span><kbd>?</kbd> wait, what?</span><span><kbd>⌘</kbd><kbd>↵</kbd> send</span>';
  stage.append(keys);
  const q = currentId && byId(currentId);
  if (q?.fresh) q.fresh = false;
}

function renderChrome() {
  renderStatus();
  renderRail();
  const n = Q.filter((q) => q.unsent).length;
  $('unsent').textContent = n ? `${n} unsent` : 'all sent';
  $('send').disabled = !n;
}
function renderCurrentOnly() {
  const card = document.querySelector('.stage .card');
  if (!card || !currentId) return render();
  const fresh = questionCard(byId(currentId));
  fresh.classList.remove('enter');
  card.replaceWith(fresh);
  renderChrome();
}
function render() {
  renderChrome();
  renderStage();
}

function skipCurrent() {
  const q = byId(currentId);
  if (!q) return;
  q.status = q.status === 'skipped' ? (q.answer ? 'answered' : 'open') : 'skipped';
  nextNeeding();
}

let toastT;
function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (el.hidden = true), 2600); }

$('send').onclick = () => { const n = Q.filter((q) => q.unsent).length; Q.forEach((q) => (q.unsent = false)); renderChrome(); toast(`Sent ${n} answer${n === 1 ? '' : 's'} to Claude.`); };
$('done').onclick = () => {
  const open = Q.filter((q) => group(q) === 0).length;
  toast(open ? `Marked done with ${open} still open; Claude will use defaults or ask.` : 'Marked done. Claude has everything.');
  Q.forEach((q) => (q.unsent = false));
  renderChrome();
};

document.addEventListener('keydown', (e) => {
  if (e.target.matches?.('textarea, input')) {
    if (e.key === 'Escape') e.target.blur();
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) $('send').click();
    return;
  }
  const q = currentId && byId(currentId);
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { $('send').click(); return; }
  if (e.key === 'Enter') { e.preventDefault(); nextNeeding(); return; }
  if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); const n = order[idx() + 1]; if (n) go(n, 1); return; }
  if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); const p = order[idx() - 1]; if (p) go(p, -1); return; }
  if (!q) return;
  if (e.key === 's' || e.key === 'S') { skipCurrent(); return; }
  if (e.key === '?') { e.preventDefault(); document.querySelector('.stage [data-act=what]')?.click(); return; }
  if (/^[1-9]$/.test(e.key) && q.type !== 'text') {
    const opts = q.type === 'yes-no' ? ['yes', 'no'] : q.options.map((o) => o.v);
    const v = opts[Number(e.key) - 1];
    if (v) pick(q, v);
  }
});

const toggleRail = () => {
  const w = $('railWrap');
  const open = !w.classList.contains('open');
  w.classList.toggle('open', open);
  $('railToggle').setAttribute('aria-expanded', String(open));
};
$('railToggle').onclick = toggleRail;
document.addEventListener('keydown', (e) => { if ((e.key === 'l' || e.key === 'L') && !e.target.matches?.('textarea, input')) toggleRail(); });

resort();
currentId = firstNeeding(null);
render();
</script>
</body>
</html>
